name: Check

# On every push and pull request: the code is formatted, the lints pass, every test passes (the
# calculations also in a browser), the worked examples match the code, and
# the web app, the Windows program and its installer still build. Nothing is published. The test
# installer is kept for 14 days under the run's Artifacts, to try before a release.
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Formatted
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Lints
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: The calculations give the same answers in a browser
        run: flutter test --platform chrome test/calc

      - name: The worked examples are up to date
        run: |
          dart run tool/worked_examples.dart > "$RUNNER_TEMP/worked-examples.md"
          diff -u docs/worked-examples.md "$RUNNER_TEMP/worked-examples.md"

      - name: Build the web app
        run: flutter build web --release --base-href /slope-calculation/app/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # the tests on Windows too: some code only runs there (the self-update check)
      - name: Tests on Windows
        run: |
          flutter pub get
          flutter test

      - name: Build the Windows program
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=NO_UPDATE_CHECK=true
          if (-not (Test-Path build\windows\x64\runner\Release\SlopeCalculator.exe)) { throw "SlopeCalculator.exe was not built" }
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Build the installer
        shell: pwsh
        working-directory: installer
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=0.0.0 installer.nsi
          if (-not (Test-Path SlopeCalculator-Setup.exe)) { throw "The installer was not made" }

      # to try before a release: Actions -> this run -> Artifacts. It doesn't look for updates.
      - uses: actions/upload-artifact@v4
        with:
          name: SlopeCalculator-Setup-test
          path: installer/SlopeCalculator-Setup.exe
          retention-days: 14
